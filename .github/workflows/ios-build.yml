name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "ios/**"
      - "app.json"
      - "package.json"

jobs:
  build:
    runs-on: macos-latest
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env from environment
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ secrets.API_URL }}" > .env
          echo "EXPO_PUBLIC_REVERB_APP_KEY=${{ secrets.REVERB_APP_KEY }}" >> .env
          echo "EXPO_PUBLIC_REVERB_HOST=${{ secrets.REVERB_HOST }}" >> .env
          echo "EXPO_PUBLIC_REVERB_PORT=${{ secrets.REVERB_PORT }}" >> .env
          echo "EXPO_PUBLIC_REVERB_SCHEME=${{ secrets.REVERB_SCHEME }}" >> .env

      - name: Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Setup certificates
        if: env.IOS_CERTIFICATE != ''
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          echo "$IOS_CERTIFICATE" | base64 --decode > certificate.p12
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build IPA
        if: env.IOS_CERTIFICATE != ''
        run: |
          xcodebuild -workspace ios/Mediscan.xcworkspace \
            -scheme Mediscan \
            -configuration Release \
            -archivePath build/Mediscan.xcarchive archive
          xcodebuild -exportArchive \
            -archivePath build/Mediscan.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/output

      - name: Upload IPA
        if: env.IOS_CERTIFICATE != ''
        uses: actions/upload-artifact@v4
        with:
          name: mediscan-ios-${{ github.sha }}
          path: build/output/*.ipa
          retention-days: 14

      - name: iOS build placeholder
        if: env.IOS_CERTIFICATE == ''
        run: |
          echo "iOS build requires Apple certificates."
          echo "Add to 'preview' environment secrets:"
          echo "  - IOS_CERTIFICATE: Base64 encoded .p12"
          echo "  - IOS_CERTIFICATE_PASSWORD: Certificate password"
          echo "  - IOS_PROVISIONING_PROFILE: Base64 encoded .mobileprovision"
