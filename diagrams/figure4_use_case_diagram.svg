  <line x1="80" y1="135" x2="210" y2="92" stroke="#111827" stroke-width="1"/>
  <line x1="80" y1="135" x2="210" y2="152" stroke="#111827" stroke-width="1"/>
  <line x1="80" y1="135" x2="210" y2="212" stroke="#111827" stroke-width="1"/>
  <line x1="80" y1="135" x2="210" y2="272" stroke="#111827" stroke-width="1"/>

  <line x1="80" y1="375" x2="210" y2="342" stroke="#111827" stroke-width="1"/>
  <line x1="80" y1="375" x2="210" y2="402" stroke="#111827" stroke-width="1"/>
  <line x1="80" y1="375" x2="210" y2="462" stroke="#111827" stroke-width="1"/>
  <line x1="80" y1="375" x2="380" y2="282" stroke="#111827" stroke-width="1"/>

  <line x1="860" y1="175" x2="720" y2="122" stroke="#111827" stroke-width="1"/>
  <line x1="860" y1="175" x2="720" y2="192" stroke="#111827" stroke-width="1"/>
  <line x1="860" y1="175" x2="620" y2="282" stroke="#111827" stroke-width="1"/>

  <line x1="860" y1="395" x2="720" y2="382" stroke="#111827" stroke-width="1"/>
  <line x1="860" y1="395" x2="720" y2="452" stroke="#111827" stroke-width="1"/>
</svg>
