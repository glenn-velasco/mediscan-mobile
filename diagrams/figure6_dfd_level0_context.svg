<svg viewBox="0 0 950 560" width="950" height="560" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#111827"/>
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="475" y="24" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">DATA FLOW DIAGRAM (DFD) LEVEL 0: CONTEXT DIAGRAM</text>

  <!-- CENTRAL PROCESS 0 -->
  <rect x="365" y="195" width="220" height="150" rx="20" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
  <line x1="365" y1="230" x2="585" y2="230" stroke="#111827" stroke-width="1.2"/>
  <text x="475" y="218" font-size="12" font-weight="bold" text-anchor="middle" fill="#111827">0.0</text>
  <text x="475" y="255" font-size="14" font-weight="700" text-anchor="middle" fill="#111827">MediScan Mobile</text>
  <text x="475" y="275" font-size="14" font-weight="700" text-anchor="middle" fill="#111827">Platform</text>
  <text x="475" y="305" font-size="11" fill="#4b5563" text-anchor="middle">(Triage, Crypto &amp; Sync)</text>

  <!-- EXTERNAL ENTITY 1: PATIENT (TOP LEFT) -->
  <rect x="40" y="50" width="180" height="70" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
  <text x="130" y="80" font-size="12" font-weight="bold" text-anchor="middle" fill="#111827">Patient / Civilian</text>
  <text x="130" y="98" font-size="10" fill="#4b5563" text-anchor="middle">[Data Owner &amp; User]</text>

  <!-- EXTERNAL ENTITY 2: FIRST RESPONDER (BOTTOM LEFT) -->
  <rect x="40" y="420" width="180" height="70" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
  <text x="130" y="450" font-size="12" font-weight="bold" text-anchor="middle" fill="#111827">First Responder</text>
  <text x="130" y="468" font-size="10" fill="#4b5563" text-anchor="middle">[EMT / Paramedic]</text>

  <!-- EXTERNAL ENTITY 3: HEALTHCARE PROFESSIONAL (TOP RIGHT) -->
  <rect x="730" y="50" width="180" height="70" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
  <text x="820" y="80" font-size="12" font-weight="bold" text-anchor="middle" fill="#111827">Healthcare Professional</text>
  <text x="820" y="98" font-size="10" fill="#4b5563" text-anchor="middle">[Doctor / Clinician]</text>

  <!-- EXTERNAL ENTITY 4: SYSTEM ADMINISTRATOR (BOTTOM RIGHT) -->
  <rect x="730" y="420" width="180" height="70" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
  <text x="820" y="450" font-size="12" font-weight="bold" text-anchor="middle" fill="#111827">System Administrator</text>
  <text x="820" y="468" font-size="10" fill="#4b5563" text-anchor="middle">[Vetting &amp; Compliance]</text>

  <!-- EXTERNAL ENTITY 5: GOOGLE CLOUD VISION API (BOTTOM CENTER) -->
  <rect x="385" y="460" width="180" height="60" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
  <text x="475" y="485" font-size="11" font-weight="bold" text-anchor="middle" fill="#111827">Google Cloud Vision</text>
  <text x="475" y="502" font-size="10" fill="#4b5563" text-anchor="middle">[External OCR Service]</text>


  <!-- DATA FLOWS: PATIENT <-> 0.0 -->
  <!-- Inflow -->
  <line x1="220" y1="75" x2="385" y2="200" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="260" y="125" font-size="10" fill="#111827" transform="rotate(35 260,125)">Demographics, Allergies, Meds, Contacts</text>

  <!-- Outflow -->
  <line x1="365" y1="230" x2="220" y2="105" stroke="#111827" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="245" y="180" font-size="10" fill="#4b5563" transform="rotate(35 245,180)">Signed Emergency QR &amp; Scan Alerts</text>


  <!-- DATA FLOWS: FIRST RESPONDER <-> 0.0 -->
  <!-- Inflow -->
  <line x1="220" y1="435" x2="375" y2="330" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="240" y="395" font-size="10" fill="#111827" transform="rotate(-35 240,395)">Scanned QR Payload, Vitals, Notes</text>

  <!-- Outflow -->
  <line x1="365" y1="310" x2="220" y2="465" stroke="#111827" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="240" y="350" font-size="10" fill="#4b5563" transform="rotate(-35 240,350)">Verified Medical Summary &amp; Handoff Data</text>


  <!-- DATA FLOWS: HEALTHCARE PROFESSIONAL <-> 0.0 -->
  <!-- Inflow -->
  <line x1="730" y1="75" x2="565" y2="200" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="680" y="130" font-size="10" fill="#111827" text-anchor="middle" transform="rotate(-35 680,130)">PRC License, Selfies, Attestations</text>

  <!-- Outflow -->
  <line x1="585" y1="230" x2="730" y2="105" stroke="#111827" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="700" y="180" font-size="10" fill="#4b5563" text-anchor="middle" transform="rotate(-35 700,180)">Verification Status &amp; Encounters</text>


  <!-- DATA FLOWS: ADMIN <-> 0.0 -->
  <!-- Inflow -->
  <line x1="730" y1="435" x2="575" y2="330" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="690" y="395" font-size="10" fill="#111827" text-anchor="middle" transform="rotate(35 690,395)">Review Decisions (Approve/Deny)</text>

  <!-- Outflow -->
  <line x1="585" y1="310" x2="730" y2="465" stroke="#111827" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="690" y="355" font-size="10" fill="#4b5563" text-anchor="middle" transform="rotate(35 690,355)">Application Queue &amp; OCR Results</text>


  <!-- DATA FLOWS: GCP VISION <-> 0.0 -->
  <!-- Inflow to Vision -->
  <line x1="455" y1="345" x2="455" y2="460" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="445" y="405" font-size="10" fill="#111827" text-anchor="end">PRC Image Data</text>

  <!-- Return from Vision -->
  <line x1="495" y1="460" x2="495" y2="345" stroke="#111827" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="505" y="405" font-size="10" fill="#4b5563" text-anchor="start">OCR Text Tokens</text>
</svg>
