<svg viewBox="0 0 950 540" width="950" height="540" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#111827"/>
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="475" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">FIGURE 5: UML 2.5 SEQUENCE DIAGRAM (OFFLINE EMERGENCY TRIAGE)</text>

  <!-- LIFELINE HEADERS -->
  <rect x="30" y="30" width="130" height="35" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="95" y="52" font-size="11" font-weight="bold" text-anchor="middle">Patient: Actor</text>

  <rect x="220" y="30" width="140" height="35" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="290" y="52" font-size="11" font-weight="bold" text-anchor="middle">PatientApp: Client</text>

  <rect x="420" y="30" width="140" height="35" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="490" y="52" font-size="11" font-weight="bold" text-anchor="middle">Keystore: Enclave</text>

  <rect x="610" y="30" width="140" height="35" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="680" y="52" font-size="11" font-weight="bold" text-anchor="middle">Responder: Actor</text>

  <rect x="790" y="30" width="140" height="35" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="860" y="52" font-size="11" font-weight="bold" text-anchor="middle">ScannerApp: Client</text>

  <!-- DASHED LIFELINES -->
  <line x1="95" y1="65" x2="95" y2="520" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="290" y1="65" x2="290" y2="520" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="490" y1="65" x2="490" y2="520" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="680" y1="65" x2="680" y2="520" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="860" y1="65" x2="860" y2="520" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- ACTIVATION BARS -->
  <rect x="284" y="90" width="12" height="110" fill="#f3f4f6" stroke="#111827" stroke-width="1"/>
  <rect x="484" y="115" width="12" height="40" fill="#f3f4f6" stroke="#111827" stroke-width="1"/>
  <rect x="854" y="230" width="12" height="280" fill="#f3f4f6" stroke="#111827" stroke-width="1"/>

  <!-- CALL 1 -->
  <line x1="95" y1="95" x2="284" y2="95" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="180" y="90" font-size="10" text-anchor="middle">1: generateEmergencyQr()</text>

  <!-- CALL 2 -->
  <line x1="296" y1="120" x2="484" y2="120" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="390" y="115" font-size="10" text-anchor="middle">2: signPayload(ed25519PrivKey)</text>

  <!-- RETURN 3 -->
  <line x1="484" y1="150" x2="296" y2="150" stroke="#111827" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="390" y="145" font-size="10" text-anchor="middle">3: return digitalSignature</text>

  <!-- RETURN 4 -->
  <line x1="284" y1="185" x2="95" y2="185" stroke="#111827" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="180" y="180" font-size="10" text-anchor="middle">4: renderQrPattern(MEDISCAN:v2)</text>

  <!-- CALL 5: OPTICAL SCAN -->
  <line x1="680" y1="235" x2="854" y2="235" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="765" y="230" font-size="10" text-anchor="middle">5: scanQrOpticalPattern()</text>

  <!-- CALL 6: SELF CALL -->
  <path d="M 866,255 L 895,255 L 895,280 L 866,280" fill="none" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="900" y="272" font-size="9">6: verifySignature(publicKey)</text>

  <!-- ALT FRAGMENT -->
  <rect x="580" y="300" width="350" height="200" fill="none" stroke="#111827" stroke-width="1.2"/>
  <polygon points="580,300 615,300 625,312 580,312" fill="#e5e7eb" stroke="#111827" stroke-width="1"/>
  <text x="588" y="310" font-size="9" font-weight="bold">alt</text>
  <text x="635" y="311" font-size="10" font-weight="bold">[Signature Authentic]</text>

  <line x1="854" y1="340" x2="680" y2="340" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="765" y="334" font-size="10" text-anchor="middle">7: displayMedicalSummary(Allergies, BloodType)</text>

  <line x1="680" y1="375" x2="854" y2="375" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="765" y="370" font-size="10" text-anchor="middle">8: logTriageVitals(BP, HR, SpO2, notes)</text>

  <!-- DIVIDER -->
  <line x1="580" y1="410" x2="930" y2="410" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="635" y="428" font-size="10" font-weight="bold">[else: Signature Corrupt / Tampered]</text>

  <line x1="854" y1="460" x2="680" y2="460" stroke="#111827" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="765" y="454" font-size="10" text-anchor="middle">9: displayAlert("UNTRUSTED / MODIFIED QR PAYLOAD")</text>
</svg>
